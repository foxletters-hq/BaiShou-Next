name: Build & Release

# 分端发版：main 合并后 push tag 触发构建
#   mobile/v1.2.4  → 仅 Android
#   desktop/v1.2.1 → 仅 Windows
# GitHub Release 挂载/展示 tag = max(mobile.version, desktop.version)，如 v1.2.12
# 手动发版：Actions → Run workflow → 选择 mobile / desktop / both
on:
  push:
    tags:
      - 'mobile/v*'
      - 'desktop/v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 发版平台
        required: true
        type: choice
        options:
          - mobile
          - desktop
          - both
          - sync-cos
      ref:
        description: 构建使用的分支或 commit（默认 main）
        required: false
        default: main
        type: string
      create_release:
        description: 构建完成后创建 GitHub Release
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', inputs.platform, inputs.ref) || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      semver: ${{ steps.resolve.outputs.semver }}
      display_semver: ${{ steps.resolve.outputs.display_semver }}
      scope: ${{ steps.resolve.outputs.scope }}
      ref: ${{ steps.resolve.outputs.ref }}
      should_release: ${{ steps.resolve.outputs.should_release }}
      build_mobile: ${{ steps.resolve.outputs.build_mobile }}
      build_desktop: ${{ steps.resolve.outputs.build_desktop }}
      mobile_tag: ${{ steps.resolve.outputs.mobile_tag }}
      desktop_tag: ${{ steps.resolve.outputs.desktop_tag }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0

      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}"
          SHOULD_RELEASE="${{ github.event_name == 'workflow_dispatch' && inputs.create_release || 'true' }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SCOPE="${{ inputs.platform }}"
            MOBILE=$(node -p "require('./apps/mobile/src/version.json').version")
            DESKTOP=$(node -p "require('./apps/desktop/src/version.json').version")
            case "$SCOPE" in
              mobile)  TAG="mobile/v${MOBILE}"; SEMVER="$MOBILE" ;;
              desktop) TAG="desktop/v${DESKTOP}"; SEMVER="$DESKTOP" ;;
              both)
                if [ "$MOBILE" != "$DESKTOP" ]; then
                  echo "::error::both 发版要求两端 version.json 相同（mobile=${MOBILE}, desktop=${DESKTOP}）"
                  exit 1
                fi
                TAG="mobile/v${MOBILE}"
                SEMVER="$MOBILE"
                ;;
              sync-cos)
                TAG="v${DESKTOP}"
                SEMVER="$DESKTOP"
                ;;
              *) echo "::error::未知 platform: $SCOPE"; exit 1 ;;
            esac
          elif [[ "${{ github.ref_name }}" =~ ^mobile/v(.+)$ ]]; then
            SCOPE="mobile"
            TAG="${{ github.ref_name }}"
            SEMVER="${BASH_REMATCH[1]}"
          elif [[ "${{ github.ref_name }}" =~ ^desktop/v(.+)$ ]]; then
            SCOPE="desktop"
            TAG="${{ github.ref_name }}"
            SEMVER="${BASH_REMATCH[1]}"
          else
            echo "::error::不支持的 tag: ${{ github.ref_name }}"
            exit 1
          fi

          BUILD_MOBILE="false"
          BUILD_DESKTOP="false"
          MOBILE_TAG=""
          DESKTOP_TAG=""
          if [ "$SCOPE" = "mobile" ] || [ "$SCOPE" = "both" ]; then
            BUILD_MOBILE="true"
            MOBILE_TAG="mobile/v${SEMVER}"
          fi
          if [ "$SCOPE" = "desktop" ] || [ "$SCOPE" = "both" ]; then
            BUILD_DESKTOP="true"
            DESKTOP_TAG="desktop/v${SEMVER}"
          fi

          # GitHub Release 展示/挂载取两端 version.json 的较大者，避免桌面 1.2.7、移动 1.2.12 时出现两条低版本 Release
          MOBILE_VER=$(node -p "require('./apps/mobile/src/version.json').version")
          DESKTOP_VER=$(node -p "require('./apps/desktop/src/version.json').version")
          DISPLAY=$(printf '%s\n' "$MOBILE_VER" "$DESKTOP_VER" | sort -V | tail -1)

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "display_semver=$DISPLAY" >> "$GITHUB_OUTPUT"
          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "build_mobile=$BUILD_MOBILE" >> "$GITHUB_OUTPUT"
          echo "build_desktop=$BUILD_DESKTOP" >> "$GITHUB_OUTPUT"
          echo "mobile_tag=$MOBILE_TAG" >> "$GITHUB_OUTPUT"
          echo "desktop_tag=$DESKTOP_TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${DISPLAY}" >> "$GITHUB_OUTPUT"

      - name: Verify tag commit is on main
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git branch -r --contains "${{ github.sha }}" | grep -qE '(^|\s)origin/main$'; then
            echo "::error::Release tag 必须指向 main 上的 commit（先合并 PR 到 main，再在 main 上打 tag）"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # prepare 仅做版本校验，不 install；启用 pnpm cache 会在 post 阶段因路径不存在而失败

      - name: Verify version manifest matches tag
        shell: bash
        run: |
          set -euo pipefail
          SEMVER="${{ steps.resolve.outputs.semver }}"
          SCOPE="${{ steps.resolve.outputs.scope }}"
          MOBILE=$(node -p "require('./apps/mobile/src/version.json').version")
          DESKTOP=$(node -p "require('./apps/desktop/src/version.json').version")
          if [ "$SCOPE" = "mobile" ] || [ "$SCOPE" = "both" ]; then
            if [ "$MOBILE" != "$SEMVER" ]; then
              echo "::error::${{ steps.resolve.outputs.mobile_tag }} 与 mobile version.json (${MOBILE}) 不一致"
              exit 1
            fi
          fi
          if [ "$SCOPE" = "desktop" ] || [ "$SCOPE" = "both" ]; then
            if [ "$DESKTOP" != "$SEMVER" ]; then
              echo "::error::${{ steps.resolve.outputs.desktop_tag }} 与 desktop version.json (${DESKTOP}) 不一致"
              exit 1
            fi
          fi
          node scripts/sync-app-version.mjs --check

  build-android:
    name: Build Android APK
    needs: prepare
    if: needs.prepare.outputs.build_mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Free disk space
        run: |
          set -euo pipefail
          df -h /
          # 只清理与后续步骤无关的冗余目录，且同步执行。
          # 不要删除 $AGENT_TOOLSDIRECTORY（/opt/hostedtoolcache）：setup-node / setup-java
          # 会把 Node 与 JDK 安装到该目录，异步删除会和安装过程竞争，
          # 导致后续 Gradle 报 "JAVA_HOME is set to an invalid directory"。
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk-bundle \
            /opt/ghc /usr/local/share/boost || true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
          cache: gradle

      # setup-java 已缓存 ~/.gradle；此处缓存 wrapper、项目元数据与 CMake/C++ 编译产物 (.cxx)，加速 RN 原生编译
      - name: Cache Gradle wrapper, metadata and CMake native build (.cxx)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            apps/mobile/android/.gradle
            apps/mobile/android/app/.cxx
          key: ${{ runner.os }}-gradle-meta-cxx-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/package.json', 'apps/mobile/app.json', 'apps/mobile/app.config.js', 'apps/mobile/plugins/**') }}
          restore-keys: |
            ${{ runner.os }}-gradle-meta-cxx-
            ${{ runner.os }}-gradle-meta-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync generated assets
        run: pnpm sync

      - name: Build diary-editor WebView bundle
        run: pnpm --filter @baishou/mobile run build:diary-editor

      - name: Prepare Android signing
        run: |
          mkdir -p apps/mobile/android/app
          echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}" > apps/mobile/android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> apps/mobile/android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> apps/mobile/android/key.properties
          echo "storeFile=app/upload-keystore.jks" >> apps/mobile/android/key.properties
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > apps/mobile/android/app/upload-keystore.jks

      - name: Build release APK
        run: pnpm --filter @baishou/mobile build:release
        env:
          BAISHOU_RELEASE_BUILD: '1'
          SKIP_SYNC: '1'
          SKIP_DIARY_EDITOR_BUILD: '1'
          # 与 build-release-apk.mjs / withAndroidReleaseArchitectures 一致：真机只打 arm64
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_FILE: app/upload-keystore.jks

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release/BaiShou-*-Android.apk

  build-windows:
    name: Build Windows Installer
    needs: prepare
    if: needs.prepare.outputs.build_desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Electron and electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('pnpm-lock.yaml', 'apps/desktop/package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            Write-Host "Inno Setup 6 已预装，跳过 choco install"
          } else {
            choco install innosetup -y --no-progress
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync generated assets
        run: pnpm sync

      - name: Build Windows installer
        run: pnpm --filter @baishou/desktop build:win:ci
        env:
          # 配置后会对 BaiShou.exe 与 Setup.exe 做 Authenticode 签名；未配置则跳过（会有 SmartScreen 警告）
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_CERT_TIMESTAMP_URL: ${{ secrets.WINDOWS_CERT_TIMESTAMP_URL }}
          # 正式发版建议在仓库 secrets 配好证书后改为 '1'，强制未签名即失败
          WINDOWS_SIGN_REQUIRED: ${{ vars.WINDOWS_SIGN_REQUIRED }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/desktop/dist/BaiShou-v*-Windows-Setup.exe

  release-mobile:
    name: Release Android
    if: |
      needs.prepare.outputs.should_release == 'true' &&
      needs.prepare.outputs.build_mobile == 'true' &&
      needs.build-android.result == 'success'
    needs: [prepare, build-android]
    runs-on: ubuntu-latest
    concurrency:
      group: gh-release-${{ needs.prepare.outputs.release_tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/

      - name: Normalize Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          SEMVER="${{ needs.prepare.outputs.semver }}"
          TARGET="artifacts/BaiShou-v${SEMVER}-Android.apk"
          for apk in artifacts/BaiShou-*-Android.apk; do
            [ -e "$apk" ] || continue
            if [ "$apk" != "$TARGET" ]; then mv "$apk" "$TARGET"; fi
            break
          done
          cp "$TARGET" artifacts/BaiShou-Android.apk
          ls -la artifacts/

      - name: Compose release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          SEMVER="${{ needs.prepare.outputs.semver }}"
          DISPLAY="${{ needs.prepare.outputs.display_semver }}"
          TAG="${{ needs.prepare.outputs.release_tag }}"
          # 固定为本 job 的平台：prepare.scope 在 workflow_dispatch both 时为 "both"，
          # 直接透传会把 Android 产物表渲染成 Windows。
          SCOPE="mobile"
          APPEND=false
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            APPEND=true
            echo "append=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "append=false" >> "$GITHUB_OUTPUT"
            HIGHEST=$(gh release list --repo "$REPO" --limit 100 --json tagName -q '.[].tagName' | sed -n 's/^v//p' | sort -V | tail -1 || true)
            if [ -n "$HIGHEST" ] && [ "$(printf '%s\n' "$DISPLAY" "$HIGHEST" | sort -V | tail -1)" != "$DISPLAY" ]; then
              echo "make_latest=false" >> "$GITHUB_OUTPUT"
            else
              echo "make_latest=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          # 自动生成说明（含 Contributors）对比上一统一 Release tag，而非分端 tag
          PREV_RELEASE=$(
            gh release list --repo "$REPO" --limit 100 --json tagName -q '.[].tagName' \
              | sed -n 's/^v//p' | sort -Vu \
              | awk -v d="$DISPLAY" '
                  $0 == d { print prev; found=1; exit }
                  { prev = $0 }
                  END { if (!found && prev != "") print prev }
                '
          )
          if [ -n "${PREV_RELEASE:-}" ]; then
            echo "previous_release_tag=v${PREV_RELEASE}" >> "$GITHUB_OUTPUT"
          else
            echo "previous_release_tag=" >> "$GITHUB_OUTPUT"
          fi
          node scripts/compose-release-body.mjs \
            --scope "$SCOPE" \
            --version "$SEMVER" \
            --display-version "$DISPLAY" \
            --repo "$REPO" \
            --append "$APPEND" \
            --output body.md

      - name: Create or update GitHub Release (Android)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: 白守 v${{ needs.prepare.outputs.display_semver }}
          append_body: ${{ steps.notes.outputs.append == 'true' }}
          body_path: body.md
          generate_release_notes: ${{ steps.notes.outputs.append != 'true' }}
          previous_tag: ${{ steps.notes.outputs.previous_release_tag }}
          files: |
            artifacts/BaiShou-v${{ needs.prepare.outputs.semver }}-Android.apk
            artifacts/BaiShou-Android.apk
          draft: false
          prerelease: false
          make_latest: ${{ steps.notes.outputs.make_latest == 'true' }}

      - name: Upload Android APK to Tencent COS
        if: env.COS_SECRET_ID != '' && env.COS_SECRET_KEY != ''
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          pip install --quiet --upgrade coscmd
          BUCKET="baishou-release-1305030750"
          REGION="ap-shanghai"
          coscmd config -a "$(echo "$COS_SECRET_ID" | tr -d '[:space:]')" -s "$(echo "$COS_SECRET_KEY" | tr -d '[:space:]')" -b "$BUCKET" -r "$REGION" -m 8 -p 2
          SEMVER="${{ needs.prepare.outputs.semver }}"
          TAG="${{ needs.prepare.outputs.release_tag }}"
          # 只跨国上传 1 份主文件，其余路径直接走腾讯云 COS 内网秒级 copy
          coscmd upload -rs "artifacts/BaiShou-Android.apk" "releases/download/${TAG}/BaiShou-Android.apk"
          coscmd copy "${BUCKET}.cos.${REGION}.myqcloud.com/releases/download/${TAG}/BaiShou-Android.apk" "latest/BaiShou-Android.apk"
          coscmd copy "${BUCKET}.cos.${REGION}.myqcloud.com/releases/download/${TAG}/BaiShou-Android.apk" "releases/download/${TAG}/BaiShou-v${SEMVER}-Android.apk"

  release-desktop:
    name: Release Windows
    if: |
      needs.prepare.outputs.should_release == 'true' &&
      needs.prepare.outputs.build_desktop == 'true' &&
      needs.build-windows.result == 'success'
    needs: [prepare, build-windows]
    runs-on: ubuntu-latest
    concurrency:
      group: gh-release-${{ needs.prepare.outputs.release_tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/

      - name: Normalize Windows artifacts
        shell: bash
        run: |
          set -euo pipefail
          SEMVER="${{ needs.prepare.outputs.semver }}"
          TARGET="artifacts/BaiShou-v${SEMVER}-Windows-Setup.exe"
          for exe in artifacts/BaiShou-*-Windows-Setup.exe; do
            [ -e "$exe" ] || continue
            if [ "$exe" != "$TARGET" ]; then mv "$exe" "$TARGET"; fi
            break
          done
          cp "$TARGET" artifacts/BaiShou-Windows-Setup.exe
          ls -la artifacts/

      - name: Compose release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          SEMVER="${{ needs.prepare.outputs.semver }}"
          DISPLAY="${{ needs.prepare.outputs.display_semver }}"
          TAG="${{ needs.prepare.outputs.release_tag }}"
          # 固定为本 job 的平台：prepare.scope 在 workflow_dispatch both 时为 "both"，
          # 直接透传会把产物表标题渲染成 Windows。
          SCOPE="desktop"
          APPEND=false
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            APPEND=true
            echo "append=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "append=false" >> "$GITHUB_OUTPUT"
            HIGHEST=$(gh release list --repo "$REPO" --limit 100 --json tagName -q '.[].tagName' | sed -n 's/^v//p' | sort -V | tail -1 || true)
            if [ -n "$HIGHEST" ] && [ "$(printf '%s\n' "$DISPLAY" "$HIGHEST" | sort -V | tail -1)" != "$DISPLAY" ]; then
              echo "make_latest=false" >> "$GITHUB_OUTPUT"
            else
              echo "make_latest=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          PREV_RELEASE=$(
            gh release list --repo "$REPO" --limit 100 --json tagName -q '.[].tagName' \
              | sed -n 's/^v//p' | sort -Vu \
              | awk -v d="$DISPLAY" '
                  $0 == d { print prev; found=1; exit }
                  { prev = $0 }
                  END { if (!found && prev != "") print prev }
                '
          )
          if [ -n "${PREV_RELEASE:-}" ]; then
            echo "previous_release_tag=v${PREV_RELEASE}" >> "$GITHUB_OUTPUT"
          else
            echo "previous_release_tag=" >> "$GITHUB_OUTPUT"
          fi
          node scripts/compose-release-body.mjs \
            --scope "$SCOPE" \
            --version "$SEMVER" \
            --display-version "$DISPLAY" \
            --repo "$REPO" \
            --append "$APPEND" \
            --output body.md

      - name: Create or update GitHub Release (Windows)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: 白守 v${{ needs.prepare.outputs.display_semver }}
          append_body: ${{ steps.notes.outputs.append == 'true' }}
          body_path: body.md
          generate_release_notes: ${{ steps.notes.outputs.append != 'true' }}
          previous_tag: ${{ steps.notes.outputs.previous_release_tag }}
          files: |
            artifacts/BaiShou-v${{ needs.prepare.outputs.semver }}-Windows-Setup.exe
            artifacts/BaiShou-Windows-Setup.exe
          draft: false
          prerelease: false
          make_latest: ${{ steps.notes.outputs.make_latest == 'true' }}

      - name: Upload Windows installer to Tencent COS
        if: env.COS_SECRET_ID != '' && env.COS_SECRET_KEY != ''
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          pip install --quiet --upgrade coscmd
          BUCKET="baishou-release-1305030750"
          REGION="ap-shanghai"
          coscmd config -a "$(echo "$COS_SECRET_ID" | tr -d '[:space:]')" -s "$(echo "$COS_SECRET_KEY" | tr -d '[:space:]')" -b "$BUCKET" -r "$REGION" -m 8 -p 2
          SEMVER="${{ needs.prepare.outputs.semver }}"
          TAG="${{ needs.prepare.outputs.release_tag }}"
          # 只跨国上传 1 份主文件，其余路径直接走腾讯云 COS 内网秒级 copy
          coscmd upload -rs "artifacts/BaiShou-Windows-Setup.exe" "releases/download/${TAG}/BaiShou-Windows-Setup.exe"
          coscmd copy "${BUCKET}.cos.${REGION}.myqcloud.com/releases/download/${TAG}/BaiShou-Windows-Setup.exe" "latest/BaiShou-Windows-Setup.exe"
          coscmd copy "${BUCKET}.cos.${REGION}.myqcloud.com/releases/download/${TAG}/BaiShou-Windows-Setup.exe" "releases/download/${TAG}/BaiShou-v${SEMVER}-Windows-Setup.exe"

  update-channel:
    name: Update release channel manifest
    needs: [prepare, release-mobile, release-desktop]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      (needs.prepare.outputs.scope == 'sync-cos' || needs.release-mobile.result == 'success' || needs.release-desktop.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch channel.json (Android)
        if: needs.release-mobile.result == 'success' || needs.prepare.outputs.scope == 'sync-cos'
        run: |
          MOBILE_VER=$(node -p "require('./apps/mobile/src/version.json').version")
          node scripts/update-release-channel.mjs \
            --platform android \
            --version "$MOBILE_VER" \
            --tag "${{ needs.prepare.outputs.release_tag }}" \
            --version-code "$(node -p "require('./apps/mobile/src/version.json').versionCode")" \
            --repo "${{ github.repository }}"

      - name: Patch channel.json (Windows)
        if: needs.release-desktop.result == 'success' || needs.prepare.outputs.scope == 'sync-cos'
        run: |
          DESKTOP_VER=$(node -p "require('./apps/desktop/src/version.json').version")
          node scripts/update-release-channel.mjs \
            --platform windows \
            --version "$DESKTOP_VER" \
            --tag "${{ needs.prepare.outputs.release_tag }}" \
            --repo "${{ github.repository }}"

      - name: Sync channel.json and missing release assets to Tencent COS
        if: env.COS_SECRET_ID != '' && env.COS_SECRET_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          pip install --quiet --upgrade coscmd
          BUCKET="baishou-release-1305030750"
          REGION="ap-shanghai"
          # coscmd 内置连接池 maxsize=10，因此线程数设为 8，分片大小设为 2MB（确保触发并发分块上传）
          coscmd config -a "$(echo "$COS_SECRET_ID" | tr -d '[:space:]')" -s "$(echo "$COS_SECRET_KEY" | tr -d '[:space:]')" -b "$BUCKET" -r "$REGION" -m 8 -p 2

          # 1. 第一时间先把几百字节的 channel.json 传上去（0.1秒生效）
          coscmd upload -rs "releases/channel.json" "channel.json"
          coscmd upload -rs "releases/channel.json" "releases/channel.json"
          echo "channel.json 已上传至 COS"

          # 2. 如果是 sync-cos 模式，从 GitHub Release 拉取主安装包并只上传 1 份，其余走 COS 内网秒级 copy
          if [ "${{ needs.prepare.outputs.scope }}" = "sync-cos" ]; then
            touch /tmp/cos-sync.log
            (
              i=0
              while true; do
                sleep 5
                i=$((i + 1))
                coscmd upload -rs /tmp/cos-sync.log "logs/sync-${{ github.run_id }}-${i}.log" >/dev/null 2>&1 || true
              done
            ) &
            LOG_PID=$!
            trap "kill $LOG_PID 2>/dev/null || true; coscmd upload -rs /tmp/cos-sync.log 'logs/sync-${{ github.run_id }}-final.log' >/dev/null 2>&1 || true" EXIT

            {
              echo "[$(date -u +%T)] 开始 sync-cos (run ${{ github.run_id }})..."
              mkdir -p cos-sync-tmp
              ANDROID_TAG=$(node -p "require('./releases/channel.json').android?.tag || ''")
              ANDROID_VER=$(node -p "require('./releases/channel.json').android?.version || ''")
              if [ -n "$ANDROID_TAG" ]; then
                echo "[$(date -u +%T)] 正在从 GitHub Release 下载 ${ANDROID_TAG}/BaiShou-Android.apk ..."
                gh release download "$ANDROID_TAG" --repo "${{ github.repository }}" -p "BaiShou-Android.apk" -D cos-sync-tmp --clobber
                ls -lh cos-sync-tmp/BaiShou-Android.apk
                echo "[$(date -u +%T)] 正在并发分片上传 BaiShou-Android.apk 到 COS ..."
                coscmd -d upload -rs "cos-sync-tmp/BaiShou-Android.apk" "releases/download/${ANDROID_TAG}/BaiShou-Android.apk"
                echo "[$(date -u +%T)] 正在 COS 内网复制 latest/BaiShou-Android.apk ..."
                coscmd copy "${BUCKET}.cos.${REGION}.myqcloud.com/releases/download/${ANDROID_TAG}/BaiShou-Android.apk" "latest/BaiShou-Android.apk"
                if [ -n "$ANDROID_VER" ]; then
                  coscmd copy "${BUCKET}.cos.${REGION}.myqcloud.com/releases/download/${ANDROID_TAG}/BaiShou-Android.apk" "releases/download/${ANDROID_TAG}/BaiShou-v${ANDROID_VER}-Android.apk"
                fi
                echo "[$(date -u +%T)] Android 同步完成！"
              fi

              WINDOWS_TAG=$(node -p "require('./releases/channel.json').windows?.tag || ''")
              WINDOWS_VER=$(node -p "require('./releases/channel.json').windows?.version || ''")
              if [ -n "$WINDOWS_TAG" ]; then
                echo "[$(date -u +%T)] 正在从 GitHub Release 下载 ${WINDOWS_TAG}/BaiShou-Windows-Setup.exe ..."
                gh release download "$WINDOWS_TAG" --repo "${{ github.repository }}" -p "BaiShou-Windows-Setup.exe" -D cos-sync-tmp --clobber
                ls -lh cos-sync-tmp/BaiShou-Windows-Setup.exe
                echo "[$(date -u +%T)] 正在并发分片上传 BaiShou-Windows-Setup.exe 到 COS ..."
                coscmd -d upload -rs "cos-sync-tmp/BaiShou-Windows-Setup.exe" "releases/download/${WINDOWS_TAG}/BaiShou-Windows-Setup.exe"
                echo "[$(date -u +%T)] 正在 COS 内网复制 latest/BaiShou-Windows-Setup.exe ..."
                coscmd copy "${BUCKET}.cos.${REGION}.myqcloud.com/releases/download/${WINDOWS_TAG}/BaiShou-Windows-Setup.exe" "latest/BaiShou-Windows-Setup.exe"
                if [ -n "$WINDOWS_VER" ]; then
                  coscmd copy "${BUCKET}.cos.${REGION}.myqcloud.com/releases/download/${WINDOWS_TAG}/BaiShou-Windows-Setup.exe" "releases/download/${WINDOWS_TAG}/BaiShou-v${WINDOWS_VER}-Windows-Setup.exe"
                fi
                echo "[$(date -u +%T)] Windows 同步完成！"
              fi
            } 2>&1 | tee -a /tmp/cos-sync.log
          fi

      - name: Commit channel manifest
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: chore/release-channel
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/channel.json
          if git diff --staged --quiet; then
            echo "channel.json 无变更"
            exit 0
          fi
          git commit -m "chore(release): 更新 releases/channel.json [skip ci]"

          # 优先直推；main 若开启 PR 保护则自动改走 PR
          if git push origin HEAD:main; then
            echo "channel.json 已直接推送到 main"
            exit 0
          fi
          echo "::warning::直推 main 被仓库规则拦截，改走 Pull Request"

          git checkout -B "$PR_BRANCH"
          git push --force origin "$PR_BRANCH"

          STATE=$(gh pr view "$PR_BRANCH" --json state -q .state 2>/dev/null || true)
          if [ "$STATE" != "OPEN" ]; then
            gh pr create \
              --base main \
              --head "$PR_BRANCH" \
              --title "chore(release): 更新 releases/channel.json" \
              --body "由 Build & Release 工作流自动创建（run ${{ github.run_id }}）。

          \`main\` 要求变更走 Pull Request，因此 channel.json 改为 PR 合并。
          合并后官网与应用内「检查更新」才会指向新版本。"
          fi

          # 无必需审批时可立即合并；否则退化为开启 auto-merge，待审批后自动合并
          for _ in 1 2 3 4 5; do
            if gh pr merge "$PR_BRANCH" --squash --delete-branch; then
              echo "channel.json PR 已合并"
              exit 0
            fi
            sleep 5
          done
          if ! gh pr merge "$PR_BRANCH" --squash --delete-branch --auto; then
            echo "::error::channel.json PR 无法自动合并，请手动合并后再验证下载入口"
            exit 1
          fi
